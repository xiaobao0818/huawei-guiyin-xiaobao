version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: attribution-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: attribution-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: attribution
      MYSQL_USER: attribution
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 3s
      retries: 5

  attribution-server:
    build:
      context: ./attribution-server
      dockerfile: Dockerfile
    container_name: attribution-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: attribution
      MYSQL_USER: attribution
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      CALLBACK_URL: ${CALLBACK_URL:-https://ppscrowd-drcn.op.hicloud.com/action-lib-track/hiad/v2/actionupload}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ATTRIBUTION_API_KEY: ${ATTRIBUTION_API_KEY:?ATTRIBUTION_API_KEY is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-frontend:
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
    container_name: attribution-admin
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - attribution-server

volumes:
  redis_data:
  mysql_data:
