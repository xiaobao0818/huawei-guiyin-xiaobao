spring:
  datasource:
    url: jdbc:h2:mem:attribution;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false

logging:
  level:
    com.attribution: DEBUG

attribution:
  encryption-key: ${ENCRYPTION_KEY:dev-attribution-secret-key-32!!}
  api-key: ${ATTRIBUTION_API_KEY:dev-report-api-key}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}
