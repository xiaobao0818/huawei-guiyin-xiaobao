spring:
  datasource:
    url: jdbc:h2:mem:attribution;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false

logging:
  level:
    com.attribution: DEBUG

attribution:
  encryption-key: ${ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}
  api-key: ${ATTRIBUTION_API_KEY:dev-report-api-key}
  security:
    swagger-public: true
    h2-console-public: true
    metrics-public: true

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}

# ============================================================
# SECURITY WARNING — 开发环境默认凭证
# ============================================================
# 以上 fallback 值仅用于本地开发开箱即用。
# 切勿在以下场景使用默认值:
#   - 生产/预发布环境 (由 prod profile 强制从环境变量读取)
#   - 存储真实用户数据的开发/测试环境
#   - 任何对外暴露的服务
#
# 覆盖方式:
#   export ENCRYPTION_KEY=$(openssl rand -hex 16)
#   export ATTRIBUTION_API_KEY=<your-secure-random-key>
#   export ADMIN_PASSWORD=<your-strong-password>
# ============================================================
